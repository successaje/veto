<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pick a place that works for everyone, without anyone having to explain why."
    />
    <title>Veto</title>
    <script>
      // Links shared before the move to real URLs used hashes (/#/r/<id>). Send them to the app.
      const legacy = location.hash.match(/^#\/(r\/[A-Za-z0-9]+|note|ledger)?/);
      if (legacy) {
        const path =
          { note: '/app/note', ledger: '/app/privacy' }[legacy[1]] ?? (legacy[1] ? '/' + legacy[1] : '/app');
        location.replace(path);
      } else location.replace('/app');
    </script>
  </head>
  <body>
    <p><a href="/app">Open Veto</a></p>
  </body>
</html>
